# Docker Compose for Development Environment

name: tripsphere

networks:
  default:
    name: tripsphere
    driver: bridge
  observability-docker-socket:
    name: tripsphere-observability-docker-socket
    driver: bridge
    internal: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

configs:
  qdrant_config:
    content: |
      log_level: INFO

services:
  trip-attraction-service:
    build:
      context: trip-attraction-service
      dockerfile: Dockerfile
    image: tripsphere/trip-attraction-service:latest
    container_name: trip-attraction-service
    logging: *default-logging
    ports:
      - "24213:24213" # HTTP
      - "50053:50053" # gRPC
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - SPRING_DATA_MONGODB_DATABASE=attraction_db
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      mongodb:
        condition: service_healthy
      nacos:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24213/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-chat-service:
    build:
      context: trip-chat-service
      dockerfile: Dockerfile
    image: tripsphere/trip-chat-service:latest
    container_name: trip-chat-service
    logging: *default-logging
    ports:
      - "24210:24210" # HTTP
    environment:
      - NACOS_SERVER_ADDRESS=${NACOS_SERVER_ADDRESS:-nacos:8848}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - MONGO_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - REVIEW_SUMMARY_URL=${REVIEW_SUMMARY_URL:-http://trip-review-summary:24212}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-api-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://higress:8080/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      nacos:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      higress:
        condition: service_healthy
      trip-order-assistant:
        condition: service_healthy
      trip-review-summary:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:24210/api/v1/health').read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  trip-file-service:
    build:
      context: trip-file-service
      dockerfile: Dockerfile
    image: tripsphere/trip-file-service:latest
    container_name: trip-file-service
    logging: *default-logging
    ports:
      - "50051:50051" # gRPC
    environment:
      - APP_ENV=dev
      - APP_NAME=trip-file-service
      - PORT=50051
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - NACOS_NAMESPACE=public
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "50051" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  trip-hotel-service:
    build:
      context: trip-hotel-service
      dockerfile: Dockerfile
    image: tripsphere/trip-hotel-service:latest
    container_name: trip-hotel-service
    logging: *default-logging
    ports:
      - "50054:50054" # gRPC
      - "24214:24214" # HTTP
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - SPRING_DATA_MONGODB_DATABASE=hotel_db
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      mongodb:
        condition: service_healthy
      nacos:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24214/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-inventory-service:
    build:
      context: trip-inventory-service
      dockerfile: Dockerfile
    image: tripsphere/trip-inventory-service:latest
    container_name: trip-inventory-service
    logging: *default-logging
    ports:
      - "24221:24221" # HTTP
      - "50061:50061" # gRPC
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-fudanse}
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24221/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  trip-itinerary-planner:
    build:
      context: trip-itinerary-planner
      dockerfile: Dockerfile
    image: tripsphere/trip-itinerary-planner:latest
    container_name: trip-itinerary-planner
    logging: *default-logging
    ports:
      - "24215:24215"
    environment:
      - NACOS_SERVER_ADDRESS=${NACOS_SERVER_ADDRESS:-nacos:8848}
      - AMAP_KEY=${AMAP_KEY:?AMAP_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-api-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://higress:8080/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      nacos:
        condition: service_healthy
      higress:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:24215/ready').read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-itinerary-service:
    build:
      context: trip-itinerary-service
      dockerfile: Dockerfile
    image: tripsphere/trip-itinerary-service:latest
    container_name: trip-itinerary-service
    logging: *default-logging
    ports:
      - "24219:24219" # HTTP
      - "50052:50052" # gRPC
    environment:
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - SPRING_DATA_MONGODB_DATABASE=itinerary_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      nacos:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24219/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-order-assistant:
    build:
      context: trip-order-assistant
      dockerfile: Dockerfile
    image: tripsphere/trip-order-assistant:latest
    container_name: trip-order-assistant
    logging: *default-logging
    ports:
      - "24211:24211" # HTTP
    environment:
      - NACOS_SERVER_ADDRESS=${NACOS_SERVER_ADDRESS:-nacos:8848}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-api-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://higress:8080/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      nacos:
        condition: service_healthy
      higress:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:24211/.well-known/agent-card.json').read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  trip-next-frontend:
    build:
      context: trip-next-frontend
      dockerfile: Dockerfile
    image: tripsphere/trip-next-frontend:latest
    container_name: trip-next-frontend
    logging: *default-logging
    ports:
      - "3000:3000" # HTTP
    environment:
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
      - COPILOT_DEFAULT_AGENT_URL=http://trip-chat-service:24210/
      - COPILOT_ITINERARY_PLANNER_URL=http://trip-itinerary-planner:24215/
      - ATTRACTION_SERVICE_ADDR=trip-attraction-service:50053
      - HOTEL_SERVICE_ADDR=trip-hotel-service:50054
      - USER_SERVICE_ADDR=trip-user-service:50056
      - ITINERARY_SERVICE_ADDR=trip-itinerary-service:50052
      - ORDER_SERVICE_ADDR=trip-order-service:50062
      - PRODUCT_SERVICE_ADDR=trip-product-service:50060
      - REVIEW_SERVICE_ADDR=trip-review-service:50057
    depends_on:
      trip-chat-service:
        condition: service_healthy
      trip-itinerary-planner:
        condition: service_healthy
      trip-attraction-service:
        condition: service_healthy
      trip-hotel-service:
        condition: service_healthy
      trip-itinerary-service:
        condition: service_healthy
      trip-order-service:
        condition: service_healthy
      trip-product-service:
        condition: service_healthy
      trip-review-service:
        condition: service_healthy
      trip-user-service:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://localhost:3000'); if (!response.ok) process.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-note-service:
    build:
      context: trip-note-service
      dockerfile: Dockerfile
    image: tripsphere/trip-note-service:latest
    container_name: trip-note-service
    logging: *default-logging
    ports:
      - "24216:24216" # HTTP
      - "50055:50055" # gRPC
    environment:
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped

  trip-order-service:
    build:
      context: trip-order-service
      dockerfile: Dockerfile
    image: tripsphere/trip-order-service:latest
    container_name: trip-order-service
    logging: *default-logging
    ports:
      - "24222:24222" # HTTP
      - "50062:50062" # gRPC
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-fudanse}
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      trip-product-service:
        condition: service_healthy
      trip-inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24222/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  trip-poi-service:
    build:
      context: trip-poi-service
      dockerfile: Dockerfile
    image: tripsphere/trip-poi-service:latest
    container_name: trip-poi-service
    logging: *default-logging
    ports:
      - "24218:24218" # HTTP
      - "50058:50058" # gRPC
    environment:
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  trip-product-service:
    build:
      context: trip-product-service
      dockerfile: Dockerfile
    image: tripsphere/trip-product-service:latest
    container_name: trip-product-service
    logging: *default-logging
    ports:
      - "24220:24220" # HTTP
      - "50060:50060" # gRPC
    environment:
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - SPRING_DATA_MONGODB_DATABASE=product_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      nacos:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24220/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trip-review-service:
    build:
      context: trip-review-service
      dockerfile: Dockerfile
    image: tripsphere/trip-review-service:latest
    container_name: trip-review-service
    logging: *default-logging
    ports:
      - "50057:50057" # gRPC
    environment:
      - APP_ENV=dev
      - APP_NAME=trip-review-service
      - PORT=50057
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
      - NACOS_NAMESPACE=public
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MONGODB_URI=mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-fudanse}@mongodb:27017
      - MONGODB_DATABASE=review_db
      - ROCKETMQ_ENDPOINT=rmq-proxy:8081
    depends_on:
      nacos:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rmq-proxy:
        condition: service_started
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./trip-review-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  trip-review-summary:
    build:
      context: trip-review-summary
      dockerfile: Dockerfile
    image: tripsphere/trip-review-summary:latest
    container_name: trip-review-summary
    logging: *default-logging
    ports:
      - "24212:24212" # HTTP
    environment:
      - NACOS_SERVER_ADDRESS=${NACOS_SERVER_ADDRESS:-nacos:8848}
      - QDRANT_URL=http://qdrant:6333
      - REVIEW_INDEX_VALIDATION_MODE=${REVIEW_INDEX_VALIDATION_MODE:-pinned}
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-fudanse@fudan.edu.cn}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-api-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://higress:8080/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    command:
      - uvicorn
      - review_summary.asgi:app
      - --host
      - "0.0.0.0"
      - --port
      - "24212"
    depends_on:
      nacos:
        condition: service_healthy
      trip-review-service:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      higress:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:24212/ready').read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  trip-review-summary-worker:
    image: tripsphere/trip-review-summary:latest
    container_name: trip-review-summary-worker
    logging: *default-logging
    environment:
      - OTEL_SERVICE_NAME=trip-review-summary-worker
      - NACOS_SERVER_ADDRESS=${NACOS_SERVER_ADDRESS:-nacos:8848}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-fudanse@fudan.edu.cn}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-api-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://higress:8080/v1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    command:
      - celery
      - -A
      - review_summary.celery.app
      - worker
      - --loglevel=info
      - --concurrency=4
    depends_on:
      nacos:
        condition: service_healthy
      trip-review-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      higress:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A review_summary.celery.app inspect ping -d celery@$${HOSTNAME} --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  trip-user-service:
    build:
      context: trip-user-service
      dockerfile: Dockerfile
    image: tripsphere/trip-user-service:latest
    container_name: trip-user-service
    logging: *default-logging
    ports:
      - "50056:50056" # gRPC
      - "24217:24217" # HTTP
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-fudanse}
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.namespace=tripsphere
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:24217/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos
    logging: *default-logging
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
    ports:
      - "18080:8080" # Console
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./volumes/nacos:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v3/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: prom/prometheus:v3.9.1
    image: tripsphere/prometheus:v3.9.1
    container_name: prometheus
    logging: *default-logging
    user: root
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./volumes/prometheus:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  tempo:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: grafana/tempo:2.8.3
    image: tripsphere/tempo:2.8.3
    container_name: tempo
    logging: *default-logging
    command: ["-config.file=/etc/tempo.yaml"]
    user: root
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - ./volumes/tempo:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  otel-collector:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:0.144.0
    image: tripsphere/otel-collector:0.144.0
    container_name: otel-collector
    logging: *default-logging
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Collector internal metrics
      - "8889:8889" # Application metrics exporter
      - "13133:13133" # Collector health endpoint
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  loki:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: grafana/loki:3.7.2
    image: tripsphere/loki:3.7.2
    container_name: loki
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: root
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./volumes/loki:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  docker-socket-proxy:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: haproxy:3.2-alpine
    image: tripsphere/docker-socket-proxy:3.2
    container_name: docker-socket-proxy
    logging: *default-logging
    user: root
    volumes:
      - ./infra/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability-docker-socket
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  alloy:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: grafana/alloy:v1.19.2
    image: tripsphere/alloy:v1.19.2
    container_name: alloy
    logging: *default-logging
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./volumes/alloy:/var/lib/alloy/data
    networks:
      - default
      - observability-docker-socket
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:12345/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    logging: *default-logging
    user: root
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana:/var/lib/grafana
    ports:
      - "13000:3000" # Use port 13000 to avoid conflict with frontend
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmq-namesrv
    logging: *default-logging
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: rmq-broker
    logging: *default-logging
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmq-namesrv:9876
    depends_on:
      rmq-namesrv:
        condition: service_started
    command: sh mqbroker

  rmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: rmq-proxy
    logging: *default-logging
    depends_on:
      rmq-broker:
        condition: service_started
      rmq-namesrv:
        condition: service_started
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: on-failure
    environment:
      - NAMESRV_ADDR=rmq-namesrv:9876
    command: sh mqproxy

  rmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmq-dashboard
    logging: *default-logging
    ports:
      - "8082:8082"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmq-namesrv:9876
    depends_on:
      rmq-namesrv:
        condition: service_started

  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: mongodb
    logging: *default-logging
    user: root # r/w permissions to the mounted directory
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-fudanse}
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGODB_INITDB_ROOT_USERNAME\" --password \"$$MONGODB_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16.13-alpine
    container_name: postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fudanse}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  qdrant:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: qdrant/qdrant:v1.16
    image: tripsphere/qdrant:v1.16
    container_name: qdrant
    logging: *default-logging
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.19
    container_name: neo4j
    logging: *default-logging
    volumes:
      - ./volumes/neo4j/logs:/logs
      - ./volumes/neo4j/config:/config
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-fudanse@fudan.edu.cn}
      - TRIPSPHERE_NEO4J_PASSWORD=${NEO4J_PASSWORD:-fudanse@fudan.edu.cn}
      - NEO4J_PLUGINS=["graph-data-science"]
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$TRIPSPHERE_NEO4J_PASSWORD\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  redis:
    image: redis:8.4
    container_name: redis
    logging: *default-logging
    volumes:
      - ./volumes/redis/data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  higress:
    build:
      context: .
      dockerfile: infra/observability/Dockerfile.healthcheck
      args:
        BASE_IMAGE: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.1.11
    image: tripsphere/higress:2.1.11
    container_name: higress
    logging: *default-logging
    environment:
      - O11Y=on
    ports:
      - "8001:8001" # Console
      - "28080:8080" # HTTP
      - "8443:8443" # HTTPS
    volumes:
      - ./volumes/higress:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
