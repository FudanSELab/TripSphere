version: '3'

# ─────────────────────────────────────────────────────────────────────────────
# Prerequisites: https://taskfile.dev
#   brew install go-task
#   curl -sL https://taskfile.dev/install.sh | sh
# ─────────────────────────────────────────────────────────────────────────────

vars:
  COMPOSE: docker-compose.yaml

tasks:

  # ── Setup ──────────────────────────────────────────────────────────────────

  init:
    desc: "Copy .env.example → .env (skips if .env already exists)"
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists — edit it manually if needed."
        else
          cp .env.example .env
          echo ".env created. Fill in credentials before starting the stack."
        fi

  # ── Stack lifecycle ────────────────────────────────────────────────────────

  up:
    desc: "Start the full stack (detached)"
    cmds:
      - docker compose -f {{.COMPOSE}} up -d

  down:
    desc: "Stop and remove containers (data in volumes/ is preserved)"
    cmds:
      - docker compose -f {{.COMPOSE}} down

  down:v:
    desc: "Stop containers AND delete all volume data (WARNING: irreversible)"
    cmds:
      - docker compose -f {{.COMPOSE}} down -v

  restart:
    desc: "Restart all containers without rebuilding"
    cmds:
      - docker compose -f {{.COMPOSE}} restart

  # ── Observability ──────────────────────────────────────────────────────────

  logs:
    desc: "Follow logs for all services"
    cmds:
      - docker compose -f {{.COMPOSE}} logs -f

  ps:
    desc: "Show status of all containers"
    cmds:
      - docker compose -f {{.COMPOSE}} ps -a

  # ── Build ──────────────────────────────────────────────────────────────────
  #
  # Built ONE AT A TIME — parallel builds trigger HTTP 429 from the Buf Schema
  # Registry (buf.build) because each service fetches .proto dependencies
  # during `docker build`.

  build:
    desc: "Build all service images sequentially (avoids Buf rate limiting)"
    cmds:
      - docker compose -f {{.COMPOSE}} build trip-attraction-service
      - docker compose -f {{.COMPOSE}} build trip-chat-service
      - docker compose -f {{.COMPOSE}} build trip-file-service
      - docker compose -f {{.COMPOSE}} build trip-hotel-service
      - docker compose -f {{.COMPOSE}} build trip-inventory-service
      - docker compose -f {{.COMPOSE}} build trip-itinerary-planner
      - docker compose -f {{.COMPOSE}} build trip-itinerary-service
      - docker compose -f {{.COMPOSE}} build trip-next-frontend
      - docker compose -f {{.COMPOSE}} build trip-note-service
      - docker compose -f {{.COMPOSE}} build trip-order-assistant
      - docker compose -f {{.COMPOSE}} build trip-order-service
      - docker compose -f {{.COMPOSE}} build trip-poi-service
      - docker compose -f {{.COMPOSE}} build trip-product-service
      - docker compose -f {{.COMPOSE}} build trip-review-service
      - docker compose -f {{.COMPOSE}} build trip-review-summary
      - docker compose -f {{.COMPOSE}} build trip-user-service

  build:one:
    desc: "Build a single service.  Usage: task build:one -- <service-name>"
    cmds:
      - docker compose -f {{.COMPOSE}} build {{.CLI_ARGS}}

  # ── Protobuf / gRPC codegen ───────────────────────────────────────────
  #
  # Run ONE AT A TIME to avoid Buf Schema rate limiting.

  gen-proto:
    desc: "Generate protobuf & gRPC codes sequentially for all services"
    cmds:
      - |
        set -eu
        for d in \
          trip-attraction-service \
          trip-chat-service \
          trip-file-service \
          trip-hotel-service \
          trip-inventory-service \
          trip-itinerary-planner \
          trip-itinerary-service \
          trip-next-frontend \
          trip-note-service \
          trip-order-assistant \
          trip-order-service \
          trip-poi-service \
          trip-product-service \
          trip-review-service \
          trip-review-summary \
          trip-user-service
        do
          echo "==> ${d} gen-proto"
          (cd "${d}" && task gen-proto)
        done

  gen-proto:one:
    desc: "Generate proto for a single service. Usage: task gen-proto:one -- <service-dir>"
    cmds:
      - |
        set -eu
        svc="{{.CLI_ARGS}}"
        if [ -z "${svc}" ]; then
          echo "Missing service dir."
          echo "Usage: task gen-proto:one -- <service-dir>"
          exit 1
        fi
        if [ ! -f "${svc}/Taskfile.yaml" ]; then
          echo "No Taskfile.yaml found in: ${svc}"
          exit 1
        fi
        (cd "${svc}" && task gen-proto)

  # ── Shortcuts ──────────────────────────────────────────────────────────────

  higress:
    desc: "Open the Higress AI Gateway console (http://localhost:8001)"
    cmds:
      - open http://localhost:8001 || xdg-open http://localhost:8001 || echo "Navigate to http://localhost:8001"

  nacos:
    desc: "Open the Nacos service discovery console (http://localhost:18080)"
    cmds:
      - open http://localhost:18080 || xdg-open http://localhost:18080 || echo "Navigate to http://localhost:18080"
