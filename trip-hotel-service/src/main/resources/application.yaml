spring:
  application:
    name: trip-hotel-service
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        metadata:
          gRPC_port: ${grpc.server.port:50054}
          protocol: grpc
  data:
    mongodb:
      uri: mongodb://root:fudanse@localhost:27017
      database: hotel_db

server:
  port: 24214

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

grpc:
  server:
    port: 50054
    enable-reflection: true
