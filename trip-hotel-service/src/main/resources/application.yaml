spring:
  application:
    name: trip-hotel-service
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        metadata:
          gRPC_port: ${grpc.server.port:50054}
          protocol: grpc
  data:
    mongodb:
      uri: mongodb://root:fudanse@localhost:27017
      database: hotel_db

server:
  port: 24214

grpc:
  server:
    port: 50054
    enable-reflection: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "level=%-5level timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=trip-hotel-service trace_id=%X{trace_id:-} span_id=%X{span_id:-} logger=%logger{36} message=%msg%n"
