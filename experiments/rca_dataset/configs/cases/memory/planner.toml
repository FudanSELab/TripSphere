case_id = "TS-RCA-MEMORY-LEAK-PLANNER"
fault_category = "Resource Fault"
fault_type = "Memory Leak"

[fault]
kind = "memory"
target = "trip-itinerary-planner"
tool = "chaosblade"

[fault.parameters]
reserve_mb = 128
rate_mb = 1
tool_container = "chaosblade-tool"

[workload]
profile = "tripsphere_mixed_realistic_50rps"
baseline_seconds = 180
fault_seconds = 300
recovery_seconds = 180
spawn_rate = 20

[collection]
prometheus_url = "http://localhost:9090"
step_seconds = 15
chunk_seconds = 60
