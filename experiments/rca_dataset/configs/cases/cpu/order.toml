case_id = "TS-RCA-CPU-HOG-ORDER"
fault_category = "Resource Fault"
fault_type = "CPU Hog"

[fault]
kind = "cpu"
target = "trip-order-service"
tool = "chaosblade"

[fault.parameters]
cpu_percent = 80
tool_container = "chaosblade-tool"
blade_tar_file = "/tmp/chaosblade.tar.gz"

[workload]
profile = "tripsphere_mixed_realistic_50rps"
baseline_seconds = 180
fault_seconds = 300
recovery_seconds = 180
spawn_rate = 20

[collection]
prometheus_url = "http://localhost:9090"
step_seconds = 15
chunk_seconds = 60
