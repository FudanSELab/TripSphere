# https://taskfile.dev

version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all
    silent: true

  users:
    desc: Seed deterministic acceptance users into user_db
    cmds:
      - uv run scripts/create_users.py

  nacos-prompts:
    desc: Publish online Prompts to Nacos Config
    cmds:
      - uv run scripts/seed_nacos_prompts.py

  ruff:
    desc: Run ruff format and ruff check --fix
    cmds:
      - uvx ruff format
      - uvx ruff check --fix
